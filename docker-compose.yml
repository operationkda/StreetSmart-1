# Local development stack for StreetSmart.
#
# Usage (from the repository root):
#   docker compose up
#
# Services:
#   postgres  — managed PostgreSQL 16
#   backend   — Node.js API on port 4000
#   frontend  — Vite dev server on port 5173 (hot-reload)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: streetsmart
      POSTGRES_USER: streetsmart
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetsmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: deps          # install prod deps only; source is mounted via the volume below
    working_dir: /app
    command: node --watch src/server.mjs
    volumes:
      - ./backend/src:/app/src:ro
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://streetsmart:devpassword@postgres:5432/streetsmart
      JWT_SECRET: dev-jwt-secret-change-in-production
      STRIPE_WEBHOOK_SECRET: whsec_dev
      ALLOWED_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - .:/app:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
