# Builds a signed iOS IPA and submits it to TestFlight.
#
# Prerequisites (set in the "production" GitHub environment):
#   Secrets:
#     APPLE_CERTIFICATE_BASE64         - base64-encoded Apple Distribution .p12 certificate
#     APPLE_CERTIFICATE_PASSWORD       - password for the .p12 file
#     APPLE_PROVISIONING_PROFILE_BASE64 - base64-encoded App Store distribution profile
#     APPLE_API_KEY                    - contents of the App Store Connect API key (.p8)
#     APPLE_API_KEY_ID                 - key ID (e.g. ABCDE12345)
#     APPLE_API_ISSUER_ID              - issuer ID from App Store Connect
#     APPLE_TEAM_ID                    - Apple Developer team ID
#   Variables:
#     VITE_API_BASE_URL                - live backend URL (baked into the web build)

name: Mobile — iOS

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build & submit iOS IPA
    # iOS builds require a macOS runner with Xcode pre-installed.
    runs-on: macos-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Web build ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # ── Capacitor iOS project ─────────────────────────────────────────────────
      - name: Install @capacitor/ios
        run: npm install @capacitor/ios

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Initialize iOS project and sync web assets
        run: |
          # `cap add ios` is idempotent — non-zero exit when folder exists is fine.
          npx cap add ios 2>/dev/null || true
          npx cap sync ios

      # ── Code signing ──────────────────────────────────────────────────────────
      - name: Import code-signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PP_DIR/streetsmart_appstore.mobileprovision"

      # ── Xcode build ───────────────────────────────────────────────────────────
      - name: Archive with xcodebuild
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StreetSmart.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="streetsmart_appstore"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StreetSmart.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreetSmart.ipa
          path: ${{ runner.temp }}/ipa/App.ipa
          retention-days: 30

      # ── TestFlight upload ─────────────────────────────────────────────────────
      - name: Submit to TestFlight
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Install the App Store Connect API key for xcrun altool.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ipa/App.ipa" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

          # Clean up key material immediately after use.
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
